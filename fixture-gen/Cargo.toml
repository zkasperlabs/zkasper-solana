[package]
name = "zkasper-fixture-gen"
description = "Generates the placeholder Groth16 fixtures the on-chain tests run against"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
zkasper-solana-program = { path = "../program", features = ["no-entrypoint"] }
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-groth16 = { version = "0.5", default-features = false }
ark-relations = "0.5"
ark-serialize = "0.5"
ark-snark = "0.5"
ark-std = "0.5"
groth16-solana = "0.2.0"
hex = "0.4"
sha2 = "0.10"
