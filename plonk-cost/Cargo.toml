[package]
name = "zkasper-plonk-cost"
description = "What a Zisk PLONK wrap would cost to verify on Solana, measured rather than modelled"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]

# `entrypoint!` expands to code guarded on the SBF target, which host clippy does
# not know about.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[features]
default = []
no-entrypoint = []
# Declared because `entrypoint!` tests for them; the defaults are used.
custom-heap = []
custom-panic = []

[dependencies]
zkasper-solana-program = { path = "../program", features = ["no-entrypoint"] }
solana-program = "4"
solana-bn254 = "3"
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ff = { version = "0.5", default-features = false }

[dev-dependencies]
zkasper-program-tests = { path = "../program-tests" }
litesvm = "=0.15.2"
solana-compute-budget-interface = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "4"
solana-pubkey = "4"
solana-signer = "3"
solana-transaction = { version = "4", features = ["serde"] }

# Same pin as `program-tests`: litesvm 0.15.2 does not compile against agave
# 4.2.x.
solana-builtins = "=4.1.2"
solana-program-runtime = "=4.1.2"
solana-transaction-context = "=4.1.2"
